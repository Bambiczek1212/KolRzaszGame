});

legs.forEach(l=>[-.02,.07].forEach(x=>{const m=new T.Mesh(new T.BoxGeometry(.03,.012,.102),M.black);m.position.set(x,.034,0);l.shoe.add(m)}));
const dT=tex(256,64,g=>{g.fillStyle='#b80f22';g.font='bold 44px sans-serif';g.textAlign='center';g.fillText('VELO',128,48)});
[1,-1].forEach(z=>{const d=new T.Mesh(new T.PlaneGeometry(.2,.05),new T.MeshBasicMaterial({map:dT,transparent:true}));d.position.set(.14,.408,z*.033);d.rotation.set(0,z>0?0:Math.PI,.569*z);all.add(d)});

function two(A,B,L1,L2,bend){const d=B.clone().sub(A);let D=Math.min(d.length(),L1+L2-.001);const dn=d.clone().normalize();
 const a=(L1*L1-L2*L2+D*D)/(2*D),h=Math.sqrt(Math.max(0,L1*L1-a*a));
 const b=bend.clone().sub(dn.clone().multiplyScalar(bend.dot(dn))).normalize();
 return A.clone().add(dn.clone().multiplyScalar(a)).add(b.multiplyScalar(h))}
let phi=-Math.PI/2,t0=0;
function pose(){
 const bob=Math.sin(phi*2)*.002;
 legs.forEach((l,i)=>{const s=l.s,ph=phi+(s>0?0:Math.PI);
  crank[i].rotation.z=ph;
  const P=V(BB[0]+.172*Math.cos(ph),.28+.172*Math.sin(ph),s*.115);pedals[i].position.copy(P);
  const ank=P.clone().add(V(-.02,.09,0)),hip=V(-.22,.93+bob,s*.095),kn=two(hip,ank,.43,.43,V(1,.12,s*.15));
  setSeg(l.thigh,hip,kn);l.knee.position.copy(kn);
  const mid=kn.clone().lerp(ank,.72);setSeg(l.shin,kn,mid);setSeg(l.sock,mid,ank);
  l.shoe.position.copy(ank).add(V(.07,-.055,0));l.shoe.rotation.z=-.08});
 arms.forEach(a=>{const s=a.s,Sh=V(.213,1.18+bob,s*.185),Hd=V(.615,.84,s*.205),E=two(Sh,Hd,.3,.29,V(0,-1,s*.6));
  const m=Sh.clone().lerp(E,.55);setSeg(a.sleeve,Sh,m);setSeg(a.upper,m,E);a.elbow.position.copy(E);setSeg(a.fore,E,Hd);a.glove.position.copy(Hd)})}
pose();

// ================= WORLD / MAPS =================
const PI=Math.PI,sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const gauss=(A,x,z)=>{let h=0;for(const[cx,cz,ch,cr]of A){const dx=x-cx,dz=z-cz,q=dx*dx+dz*dz;if(q<cr*cr*9)h+=ch*Math.exp(-q/(2*cr*cr))}return h};
const noiseH=(x,z,a)=>(Math.sin(x*.021)*Math.cos(z*.017)*5+Math.sin(x*.043+1.3)*Math.sin(z*.039)*2.5+Math.sin(x*.09+z*.07)*.7)*a;
function moundsA(n,R,skip,h0,h1,r0,r1){const A=[];for(let i=0;i<n*20&&A.length<n;i++){const x=rnd(-R,R),z=rnd(-R,R);if(!skip(x,z))A.push([x,z,rnd(h0,h1),rnd(r0,r1)])}return A}
function linesA(n,R,skip){const A=[];for(let l=0;l<n;l++){const x=rnd(-R,R),z=rnd(-R,R),a=rnd(0,6.28);if(skip(x,z))continue;for(let k=0;k<6;k++)A.push([x+Math.sin(a)*k*15,z+Math.cos(a)*k*15,2.6,5.5])}return A}
const dm=new T.Object3D(),OB=[],RAMPS=[],mapG=new T.Group();scene.add(mapG);
let MAP,pa,SZ,SEG,RM;
const rockC=new T.Color(.42,.42,.44),BROWN=new T.Color(.25,.16,.09);
// textures + materials
const noiseT=tex(128,128,g=>{g.fillStyle='#c9c9c9';g.fillRect(0,0,128,128);for(let i=0;i<2500;i++){const v=150+Math.random()*100|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(rnd(0,128),rnd(0,128),2,3)}});
const woodT=tex(256,256,g=>{g.fillStyle='#9a6a38';g.fillRect(0,0,256,256);
 for(let y=0;y<256;y+=32){g.fillStyle=`hsl(28,45%,${rnd(30,42)}%)`;g.fillRect(0,y,256,30);g.fillStyle='#2a1808';g.fillRect(0,y+30,256,2);
  for(let i=0;i<30;i++){g.strokeStyle=`rgba(40,20,5,${rnd(.1,.3)})`;g.beginPath();const yy=y+rnd(2,28);g.moveTo(0,yy);g.lineTo(256,yy+rnd(-2,2));g.stroke()}}});
const gridT=tex(128,128,g=>{g.fillStyle='#f4f4f4';g.fillRect(0,0,128,128);g.fillStyle='#e0e0e2';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);g.strokeStyle='#7d838e';g.lineWidth=3;g.strokeRect(0,0,128,128)});
const bldT=tex(256,256,g=>{g.fillStyle='#8b8e93';g.fillRect(0,0,256,256);for(let y=8;y<256;y+=32)for(let x=8;x<256;x+=32){g.fillStyle=Math.random()<.2?'#cdd6e0':'#2f3a47';g.fillRect(x,y,20,22)}});
[noiseT,woodT,gridT,bldT].forEach(t=>t.wrapS=t.wrapT=T.RepeatWrapping);woodT.repeat.set(.35,.35);bldT.repeat.set(.12,.12);
const MT={wood:new T.MeshStandardMaterial({map:woodT,roughness:.8}),white:new T.MeshStandardMaterial({color:0xf2f2f2,roughness:.55}),conc:new T.MeshStandardMaterial({color:0x9a9a9a,roughness:.9}),bld:new T.MeshStandardMaterial({map:bldT,roughness:.85})};
// ramps (also used as boxes/buildings)
function addRamp(x,z,psi,w,tops,y0,mat){
 y0=y0==null?terr(x,z):y0;const L=tops[tops.length-1][0];
 RAMPS.push({x,z,sn:Math.sin(psi),cs:Math.cos(psi),w,tops,L,y0});
 const sh=new T.Shape();sh.moveTo(0,0);tops.forEach(p=>sh.lineTo(p[0],p[1]));sh.lineTo(L,0);sh.lineTo(0,0);
 const g=new T.ExtrudeGeometry(sh,{depth:w,bevelEnabled:false});g.translate(0,0,-w/2);
 const m=new T.Mesh(g,mat||RM);m.position.set(x,y0,z);m.rotation.y=psi-PI/2;m.castShadow=m.receiveShadow=true;mapG.add(m)}
function rampH(r,x,z){const dx=x-r.x,dz=z-r.z,u=dx*r.sn+dz*r.cs,v=dx*r.cs-dz*r.sn;
 if(Math.abs(v)>r.w/2||u<0||u>r.L)return-1e9;const t=r.tops;

  let s=gsc[i]*(1-sm(GR*.6,GR*.97,Math.max(Math.abs(x-cx),Math.abs(z-cz))));
  if((MAP.trail&&Math.abs(x)<9&&z>-212&&z<-92)||Math.abs(terrF(x+1.5,z)-terrF(x-1.5,z))>1.1||Math.abs(x)>E||Math.abs(z)>E)s=0;
  else for(const r of RAMPS)if(rampH(r,x,z)>-1e8){s=0;break}
  dm.position.set(x,y-.02,z);dm.rotation.set(0,gyw[i],0);dm.scale.set(s,s,s);dm.updateMatrix();grass.setMatrixAt(i,dm.matrix)}
 grass.instanceMatrix.needsUpdate=true}

// ---------- load map ----------
function loadMap(i){
 MAP=MAPS[i];
 for(const c of[...mapG.children]){mapG.remove(c);if(c.geometry)c.geometry.dispose()}
 RAMPS.length=0;OB.length=0;SZ=MAP.size;SEG=MAP.seg;RM=MT[MAP.rm||'wood'];
 const tg=new T.PlaneGeometry(SZ,SZ,SEG,SEG);tg.rotateX(-PI/2);pa=tg.attributes.position;
 for(let k=0;k<pa.count;k++)pa.setY(k,MAP.h(pa.getX(k),pa.getZ(k)));tg.computeVertexNormals();
 const nm=tg.attributes.normal,cols=[],C=new T.Color();
 for(let k=0;k<pa.count;k++){C.setRGB(1,1,1);MAP.col(pa.getX(k),pa.getZ(k),pa.getY(k),1-nm.getY(k),C);cols.push(C.r,C.g,C.b)}
 tg.setAttribute('color',new T.Float32BufferAttribute(cols,3));
 const tx=MAP.tex||noiseT,rp=SZ/(MAP.tex?10:4.2);tx.repeat.set(rp,rp);
 const ter=new T.Mesh(tg,new T.MeshStandardMaterial({map:tx,bumpMap:MAP.tex?null:noiseT,bumpScale:2,vertexColors:true,roughness:.95}));ter.receiveShadow=true;mapG.add(ter);
 MAP.build();
 skyU.topC.value.set(MAP.sky[0]);skyU.horC.value.set(MAP.sky[1]);scene.background.set(MAP.sky[1]);scene.fog.color.set(MAP.sky[1]);scene.fog.near=MAP.sky[2];scene.fog.far=MAP.sky[3];
 far.material.color.set(MAP.far);mountR.visible=!!MAP.mount;clouds.forEach(c=>c.visible=!!MAP.cloud);grass.visible=!!MAP.grass;gm.color.set(MAP.gt||0xffffff);
 SUN.set(...(MAP.sun||[.55,.6,.45])).normalize();
 spawn(0);say(MAP.name,2.5);$('ms').value=i}
// ================= GAME =================
const K={l:0,r:0,g:0,b:0,j:0,s:0};
const km={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'g',w:'g',W:'g',ArrowDown:'b',s:'b',S:'b',' ':'j',Shift:'s'};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')spawn(0);if(e.key==='t'||e.key==='T')spawn(1);if(e.key>='1'&&e.key<='8')loadMap(+e.key-1);if(km[e.key]){K[km[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(km[e.key])K[km[e.key]]=0});
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{K[k]=1;b.classList.add('on');b.setPointerCapture(e.pointerId);e.preventDefault()});
 const up=()=>{K[k]=0;b.classList.remove('on')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
const $=id=>document.getElementById(id);
const P={x:0,z:0,y:0,vy:0,v:0,th:0,air:0,spin:0,crash:0,pitch:0,roll:0,jx:0,jz:0,hop:0};
let mode='park',camH=0,best=0,msgT=0;
function say(t,s){$('msg').textContent=t;$('msg').style.opacity=1;msgT=s||1.6}
function spawn(k){const sp=MAP.spawns[k||0]||MAP.spawns[0];Object.assign(P,{vy:0,v:0,air:0,spin:0,crash:0,pitch:0,roll:0,x:sp[0],z:sp[1],th:sp[2]});
 P.y=gh(P.x,P.z);camH=P.th;cam.position.set(P.x-Math.cos(camH)*7,P.y+3,P.z+Math.sin(camH)*7);gcx=1e9}

const wr=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
function crash(t){if(MAP.inv){P.x-=Math.cos(P.th)*1.2;P.z+=Math.sin(P.th)*1.2;P.th+=PI;P.v*=.45;P.vy=Math.max(P.vy,2.5);P.air=1;P.spin=0;say('ODBICIE!',.8);return}P.crash=2.2;P.side=Math.random()<.5?-1:1;P.air=0;P.v*=.85;P.spin=0;P.x-=Math.cos(P.th)*.7;P.z+=Math.sin(P.th)*.7;say(t||'WYWROTKA!',2)}
function slopeAt(x,z,fx,fz){const e=.7;return(gh(x+fx*e,z+fz*e)-gh(x-fx*e,z-fz*e))/(2*e)}
function step(dt){
 const fx=Math.cos(P.th),fz=-Math.sin(P.th),st=K.l-K.r;P.hop-=dt;
 if(P.crash>0){P.crash-=dt;P.v*=Math.exp(-2.6*dt);P.x+=fx*P.v*dt;P.z+=fz*P.v*dt;P.y+=P.vy*dt;P.vy-=9.8*dt;const ng=gh(P.x,P.z);if(P.y<ng){P.y=ng;P.vy=0}
  P.pitch+=(Math.atan(slopeAt(P.x,P.z,fx,fz))-P.pitch)*Math.min(1,6*dt);if(P.crash<=0){P.crash=0;P.v=0;P.air=0;P.vy=0}return}
 if(!P.air){
  const sl=slopeAt(P.x,P.z,fx,fz),co=1/Math.sqrt(1+sl*sl);
  P.v+=(-9.8*sl*co+(K.g?(K.s?20:12)*Math.max(0,1-P.v/(K.s?34:28)):0)-MAP.drag*P.v*P.v-(P.v>0?.25:0)-(K.b?14:0))*dt;if(P.v<0)P.v=0;
  P.th+=st*dt*(.7+1.9*Math.min(1,P.v/8))*(1-Math.min(P.v,30)/48);
  P.x+=Math.cos(P.th)*P.v*co*dt;P.z-=Math.sin(P.th)*P.v*co*dt;
  const ng=gh(P.x,P.z);if(ng-P.y>.8&&P.v>1){crash('UDERZENIE!');return}
  const vyG=(ng-P.y)/dt;
  if(K.j&&P.hop<=0){P.air=1;P.hop=.5;P.vy=Math.max(P.vy,0)+4.5;P.y=ng+.02;P.jx=P.x;P.jz=P.z;P.spin=0}
  else if(vyG<P.vy-3.5&&P.v>5){P.air=1;P.y+=P.vy*dt;P.vy-=9.8*dt;P.jx=P.x;P.jz=P.z;P.spin=0}
  else{P.y=ng;P.vy=vyG}
  P.pitch+=(Math.atan(sl)-P.pitch)*Math.min(1,10*dt);
 }else{
  P.spin+=st*4.5*dt;P.x+=Math.cos(P.th)*P.v*dt;P.z-=Math.sin(P.th)*P.v*dt;P.y+=P.vy*dt;P.vy-=9.8*dt;P.v*=1-.01*dt;
  P.pitch+=(Math.atan2(P.vy,Math.max(P.v,1))*.8-P.pitch)*Math.min(1,4*dt);
  const ng=gh(P.x,P.z);
  if(P.y<=ng){
   const gx=Math.cos(P.th),gz=-Math.sin(P.th),sl=slopeAt(P.x,P.z,gx,gz),cl=P.v*sl-P.vy;
   if(ng-P.y>.9){crash('UDERZENIE!');return}
   if(!MAP.inv&&Math.abs(wr(P.spin))>.9){crash('ZLE LADOWANIE!');return}
   if(!MAP.inv&&cl>(MAP.cl||15.5)){crash('ZA TWARDO!');return}
   const n=Math.round(Math.abs(P.spin)/(2*Math.PI)),d=Math.hypot(P.x-P.jx,P.z-P.jz);
   P.air=0;P.y=ng;P.vy=P.v*sl;P.v*=Math.max(.7,1-Math.max(0,cl-4)*.012);P.spin=0;
   if(d>8){if(d>best){best=d;$('best').textContent=Math.round(best)+' m'}say('SKOK '+Math.round(d)+' m'+(n?'  +'+n+'× OBRÓT':''),2)}
  }
 }
 for(const o of OB){const dx=o.x-P.x,dz=o.z-P.z;if(dx*dx+dz*dz<o.r*o.r&&P.y<o.top){const d=Math.sqrt(dx*dx+dz*dz)||1;P.x=o.x-dx/d*(o.r+.5);P.z=o.z-dz/d*(o.r+.5);crash('PRZESZKODA!');return}}
 const rr=Math.hypot(P.x,P.z);if(rr>MAP.lim){P.x*=MAP.lim/rr;P.z*=MAP.lim/rr;P.v*=.6}
 P.roll+=(-st*.35*Math.min(1,P.v/10)-P.roll)*Math.min(1,8*dt);
}
function render(dt){
 if(P.crash>0){const tg_=P.crash>.55?P.side*1.5:0;P.roll+=(tg_-P.roll)*Math.min(1,(P.crash>.55?10:3.5)*dt)}
 GT.value+=dt;if(grass.visible&&Math.hypot(P.x-gcx,P.z-gcz)>6)regrass(P.x,P.z);
 rig.position.set(P.x,P.y+.3*Math.abs(Math.sin(P.roll)),P.z);rig.rotation.order='YZX';rig.rotation.set(P.roll,P.th+(P.air?P.spin:0),P.pitch);
 phi-=P.v/(.34*2.6)*dt;wheels.forEach(w=>w.rotation.z-=P.v/.34*dt);pose();
 camH+=wr(P.th-camH)*Math.min(1,3*dt);
 if(!drag){camYaw*=Math.exp(-2.5*dt);camPit*=Math.exp(-2.5*dt)}const ca=camH+camYaw,back=(7+P.v*.06)*zm,cx=P.x-Math.cos(ca)*back,cz=P.z+Math.sin(ca)*back,cy=Math.max(P.y+2.7+camPit*6,gh(cx,cz)+1.6);
 const k=Math.min(1,7*dt);cam.position.x+=(cx-cam.position.x)*k;cam.position.z+=(cz-cam.position.z)*k;cam.position.y+=(cy-cam.position.y)*k;
 cam.lookAt(P.x+Math.cos(ca)*3,P.y+1.1,P.z-Math.sin(ca)*3);
 cam.fov+=((62+P.v*.7)-cam.fov)*Math.min(1,4*dt);cam.updateProjectionMatrix();
 key.position.set(P.x+SUN.x*110,P.y+SUN.y*110,P.z+SUN.z*110);sky.position.copy(cam.position);moveClouds(dt);mountR.position.set(P.x,0,P.z);far.position.x=P.x;far.position.z=P.z;key.target.position.set(P.x,P.y,P.z);
 $('spd').textContent=Math.round(P.v*3.6)+' km/h';
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0}
}
let camYaw=0,camPit=0,drag=0,zm=1;
ren.domElement.addEventListener('mousedown',()=>drag=1);addEventListener('mouseup',()=>drag=0);
addEventListener('mousemove',e=>{if(drag){camYaw-=e.movementX*.006;camPit=Math.max(-.4,Math.min(1,camPit+e.movementY*.004))}});
addEventListener('wheel',e=>{zm=Math.max(.5,Math.min(2.5,zm*(1+e.deltaY*.001)))},{passive:true});
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();MAPS.forEach((m,i)=>$('ms').add(new Option(m.name,i)));$('ms').onchange=e=>{loadMap(+e.target.value);e.target.blur()};loadMap(0);
let tl=performance.now();
function loop(t){const dt=Math.min(.033,(t-tl)/1000);tl=t;step(dt/2);step(dt/2);render(dt);ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
